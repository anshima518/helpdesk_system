<!DOCTYPE html>
<html>
<head>

<title>All Tickets</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Segoe UI;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

a{
    color:#38bdf8;
    text-decoration:none;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
}

th,td{
    padding:15px;
    border:1px solid #334155;
    text-align:left;
}

th{
    background:#0f172a;
}

tr:hover{
    background:#334155;
}

.back{
    margin-bottom:20px;
    display:inline-block;
}

</style>

</head>

<body>

<a href="/" class="back">
⬅ Back To Dashboard
</a>

<h1>Stored Tickets</h1>

<form method="GET">

    <input
        type="text"
        name="search"
        value="{{ search }}"
        placeholder="Search tickets..."
        style="
        padding:10px;
        width:300px;
        border-radius:8px;
        border:none;
        margin-bottom:20px;
        ">

    <button type="submit">
        Search
    </button>

</form>
<table>

<tr>
    <th>ID</th>
    <th>Ticket</th>
    <th>Category</th>
    <th>Confidence</th>
    <th>Priority</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for row in rows %}

<tr>

    <tr>

        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}%</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[5] }}</td>
    
        <td>
    
            <a href="/update_status/{{ row[0] }}/Open">
                Open
            </a>
    
            |
    
            <a href="/update_status/{{ row[0] }}/In Progress">
                In Progress
            </a>
    
            |
    
            <a href="/update_status/{{ row[0] }}/Closed">
                Closed
            </a>
    
            <br><br>
    
            <a href="/delete/{{ row[0] }}"
               onclick="return confirm('Delete this ticket?')"
               style="
               background:red;
               color:white;
               padding:6px 12px;
               border-radius:6px;
               text-decoration:none;
               ">
               Delete
            </a>
    
        </td>
    
    </tr>

</tr>

{% endfor %}

</table>

</body>
</html>
