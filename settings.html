<!DOCTYPE html>
<html>
<head>
<title>Settings</title>

<style>

body{
    background:#0f172a;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#111827;
    padding:40px;
    border-radius:20px;
    width:400px;
    text-align:center;
}

.btn{
    display:block;
    margin:15px 0;
    padding:15px;
    text-decoration:none;
    color:white;
    border-radius:10px;
    font-size:18px;
}

.login{
    background:#2563eb;
}

.signup{
    background:#22c55e;
}

.logout{
    background:#ef4444;
}

</style>
</head>

<body>

<div class="card">

<h1>⚙️ Settings</h1>

<a href="/login" class="btn login">
🔐 Login
</a>

<a href="/signup" class="btn signup">
📝 Sign Up
</a>

<a href="/logout" class="btn logout">
🚪 Logout
</a>

<a href="/accounts" class="btn login">
    👤 Accounts History
</a>

</div>

</body>
</html>
