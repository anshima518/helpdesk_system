<!DOCTYPE html>
<html>
<head>
<title>Sign Up</title>

<style>

body{
    background:#0f172a;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:#111827;
    padding:30px;
    border-radius:15px;
    color:white;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#22c55e;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

a{
    color:#60a5fa;
    text-decoration:none;
}

.error{
    color:red;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="card">

<h2>📝 Create Account</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Sign Up
</button>

</form>

<br>

<a href="/login">
Already have an account?
</a>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</div>

</body>
</html>
