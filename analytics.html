<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analytics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:40px;
}

.card{
    background:#111827;
    padding:30px;
    border-radius:20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.chart-container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.chart-box{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

.chart-box h2{
    text-align:center;
    margin-bottom:20px;
}

canvas{
    width:100% !important;
    height:400px !important;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>

<a href="/" class="back-btn">
← Dashboard
</a>

<div class="card">

<h1>📊 Helpdesk Analytics Dashboard</h1>

<div class="chart-container">

    <!-- Category Pie Chart -->

    <div class="chart-box">

        <h2>Category Distribution</h2>

        <canvas id="categoryChart"></canvas>

    </div>

    <!-- Priority Bar Chart -->

    <div class="chart-box">

        <h2>Priority Distribution</h2>

        <canvas id="priorityChart"></canvas>

    </div>

</div>

</div>

<script>

/* CATEGORY DATA */

const categoryLabels =
{{ category_labels|tojson }};

const categoryValues =
{{ category_values|tojson }};

/* PIE CHART */

new Chart(
document.getElementById('categoryChart'),
{
    type:'pie',

    data:{
        labels:categoryLabels,

        datasets:[{
            data:categoryValues,

            backgroundColor:[
                '#f97316',
                '#3b82f6',
                '#22c55e',
                '#a855f7',
                '#ef4444'
            ]
        }]
    }
}
);

/* PRIORITY DATA */

const priorityLabels =
{{ priority_labels|tojson }};

const priorityValues =
{{ priority_values|tojson }};

/* BAR CHART */

new Chart(
document.getElementById('priorityChart'),
{
    type:'bar',

    data:{
        labels:priorityLabels,

        datasets:[{
            label:'Tickets',

            data:priorityValues,

            backgroundColor:[
                '#ef4444',
                '#f59e0b',
                '#22c55e'
            ],

            borderRadius:10
        }]
    },

    options:{
        responsive:true,

        plugins:{
            legend:{
                display:false
            }
        },

        scales:{
            y:{
                beginAtZero:true
            }
        }
    }
}
);

</script>

</body>
</html>
